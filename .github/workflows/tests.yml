name: v3 tests

on:
  push:
    branches:
      - v3.0-engineering-upgrade
  pull_request:
    branches:
      - v3.0-engineering-upgrade

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: upload
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
        working-directory: .
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v
